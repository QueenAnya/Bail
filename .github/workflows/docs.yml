name: Docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'lib/**/*.d.ts'
      - 'script/apiref.js'
      - 'script/builddocs.js'
      - 'script/markdown.js'
      - 'package.json'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anya-baileys-docs-web
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish to web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack cache clean
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install Dependencies
        run: |
          yarn cache clean
          rm yarn.lock .yarn/cache -rf
          yarn install
          yarn install --mode=update-lockfile
          yarn install --no-immutable
      - name: Build the library
        run: yarn build

      - name: Build the site
        # `build:docs` is typedoc, which writes to docs/api and leaves site/ missing — the publish step below copies
        # site/, so it needs the real site builder.
        run: yarn build:docs2

      - name: Identify as the repository owner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to the web branch
        run: |
          if git ls-remote --exit-code --heads origin web; then
            git fetch origin web:web
            git worktree add ../web-out web
          else
            git worktree add --orphan -b web ../web-out
          fi

          find ../web-out -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r site/. ../web-out/

          cd ../web-out
          git add -A

          if git diff --staged --quiet; then
            echo "Site unchanged."
            exit 0
          fi

          git -c commit.gpgsign=false commit -m "docs: rebuild from ${GITHUB_SHA::7}"

          for attempt in 1 2 3 4; do
            if git push origin web; then
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase origin web || true
          done

          echo "Push failed after 4 attempts."
          exit 1
