name: Lint Fix (proto-extract)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-fix-proto-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install packages
        run: yarn install --no-immutable

      - name: Run tsc and eslint --fix on proto-extract
        run: yarn tsc && yarn eslint proto-extract --ext .js,.ts --fix

      - name: Commit and push fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: lint fix proto-extract"
            git push
          else
            echo "No changes to commit"
          fi
