name: E2E Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (local transport harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack cache clean
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install dependencies
        # yarn 4, like every other workflow: `npm install` would rewrite yarn.lock in the old v1 format
        run: |
          yarn cache clean
          rm yarn.lock .yarn/cache -rf
          yarn install
          yarn install --mode=update-lockfile
          yarn install --no-immutable

      - name: Build
        run: npm run build

      - name: Run E2E tests
        # `test:e2e2` is the local transport harness (no credentials, no network);
        # `test:e2e` is the older jest suite under src/__tests__/e2e, which needs a mock server
        run: npm run test:e2e2

# Upstream's e2e job runs a mock WhatsApp server (`ghcr.io/whiskeysockets-devtools/bartender`) that needs a private
# GHCR token, so it cannot run in a fork. This job runs the transport half of the same idea against a local `ws`
# endpoint instead: it proves the socket opens, reaches `connection: 'connecting'` and shuts down cleanly, with no
# credentials and no network. To exercise the full handshake, run the same suite with `SOCKET_URL` pointing at a mock
# server you host yourself.
