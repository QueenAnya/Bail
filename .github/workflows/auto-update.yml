name: Auto Update

# Ported from elaina-baileys (21-oct): manual runs only publish when `publish` is true,
# the whole tree is staged with `git add -A`, and the version bump / tag / summary steps are kept.
# Adapted for this repo: yarn instead of npm, the TypeScript sources (`yarn update:version`) and
# the @teamolduser/baileys package. The proto refresh stays in update-proto.yml / update-protos.yml,
# because script/syncproto.js rewrites elaina-style WAProto output.

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: 'Force release even if no WA changes detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish:
        description: 'Publish to NPM after the release commit'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: teamolduser-baileys-auto-release
  cancel-in-progress: false

jobs:
  update:
    name: Update & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Show environment
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install

      - name: Update WhatsApp version
        run: yarn update:version

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No WhatsApp changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "WhatsApp changes detected."
            git diff --staged --stat
          fi

      - name: Stop if no changes
        if: steps.changes.outputs.changed == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "No changes and force=false."
          echo "Release skipped."

      - name: Bump package version
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pkgPath = './package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          const current = pkg.version
          const bump = process.env.BUMP || 'patch'
          function parse(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z-]+)\.(\d+))?$/)
            if (!match) throw new Error(`Unsupported version format: ${version}`)
            return { major: Number(match[1]), minor: Number(match[2]), patch: Number(match[3]), tag: match[4] || null, prerelease: match[5] ? Number(match[5]) : null }
          }
          function carry(major, minor, patch) {
            if (patch > 9) { patch = 0; minor += 1 }
            if (minor > 9) { minor = 0; major += 1 }
            return { major, minor, patch }
          }
          function bumpStable(version, type) {
            const v = parse(version)
            if (type === 'major') return `${v.major + 1}.0.0`
            if (type === 'minor') { const c = carry(v.major, v.minor + 1, 0); return `${c.major}.${c.minor}.0` }
            const c = carry(v.major, v.minor, v.patch + 1); return `${c.major}.${c.minor}.${c.patch}`
          }
          function bumpVersion(version, type) {
            const v = parse(version)
            if (!v.tag) return bumpStable(version, type)
            if (type === 'major') return `${v.major + 1}.0.0-${v.tag}.1`
            if (type === 'minor') { const c = carry(v.major, v.minor + 1, 0); return `${c.major}.${c.minor}.0-${v.tag}.1` }
            return `${v.major}.${v.minor}.${v.patch}-${v.tag}.${v.prerelease + 1}`
          }
          const next = bumpVersion(current, bump)
          pkg.version = next
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          console.log(`Version: ${current} -> ${next}`)
          NODE

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p 'require("./package.json").version')
          git add -A
          git commit -m "chore: release v${VERSION} — WA update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git pull --rebase origin main || true
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
          else
            git tag "v${VERSION}"
          fi
          git push origin main || true
          git push origin "v${VERSION}" || true

      - name: Publish to NPM
        if: (steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true') && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          echo "Preparing ${PACKAGE_NAME}@${VERSION}"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already on NPM."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "Publishing prerelease with npm tag: ${TAG}"
            npm publish --access public --tag "${TAG}"
          else
            echo "Publishing stable release with npm tag: latest"
            npm publish --access public
          fi
          echo "Published ${PACKAGE_NAME}@${VERSION}"

      - name: Summary
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          echo "### Auto Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`${PACKAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "- NPM tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NPM tag: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "- Publish allowed (manual): \`true\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- Publish allowed (manual): \`false\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Publish allowed (auto run): \`true\`" >> "$GITHUB_STEP_SUMMARY"
          fi
